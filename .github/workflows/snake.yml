name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#D16BA5&color_dots=#FFF5F9,#FFE0EC,#FFC8DD,#F49AC1,#E4C1F9
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFC8DD&color_dots=#2A1F2D,#5C3A5E,#8E5A8A,#C27BA8,#F49AC1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
